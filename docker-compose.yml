services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hybrid
      POSTGRES_PASSWORD: hybrid
      POSTGRES_DB: hybrid
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybrid -d hybrid"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
